[project]
name = "nvagik"
version = "0.1.7"
description = "Free, open-source digital audio workstation (DAW) for Windows with an Armenian, Russian and English interface."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Erik Cholakhyan" }
]
requires-python = ">=3.15"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
nvagik = "nvagik:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# PERF = performance anti-patterns, S = security (bandit): both are top project rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PERF", "S", "RUF"]
ignore = ["E501"]  # the formatter handles line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
".claude/hooks/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
