[project]
name = "nvagik"
version = "0.1.0"
description = "Free, open-source digital audio workstation (DAW) for Windows with an Armenian, Russian and English interface."
readme = "README.md"
authors = [
    { name = "Erik Cholakhyan" }
]
requires-python = ">=3.15"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
nvagik = "nvagik:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
